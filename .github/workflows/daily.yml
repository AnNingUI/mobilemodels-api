name: daily-collect

on:
  schedule:
    # 每天 18:00 UTC = 北京时间 02:00（凌晨低峰）
    - cron: "0 18 * * *"
  workflow_dispatch: {} # 支持手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: download prebuilt binary (built by build-release workflow)
        run: |
          for i in $(seq 1 8); do
            curl -sL "https://github.com/${{ github.repository }}/releases/latest/download/mobilemodels-db" -o mobilemodels-db && chmod +x mobilemodels-db && break
            echo "retry $i"; sleep 15
          done
          ./mobilemodels-db --help 2>&1 | head -1

      - name: collect from Google Play (official device list)
        run: ./mobilemodels-db collect --source google-play --out brands

      # Apple 全系（Wikipedia List of iPhone models：A 编号 + 硬件代号）
      - name: collect Apple (complete, Wikipedia)
        run: ./mobilemodels-db collect --source apple-all --out brands
      # Wikipedia（CC BY-SA）：CI US 运行器可访问
      - name: collect Huawei / HarmonyOS (Wikipedia)
        run: ./mobilemodels-db collect --source wikipedia-huawei --out brands
      # 工信部进网许可（国行手机权威数据）
      # 首次全量约 44k 条需 1-3.5 小时；已有完整数据后只增量抓最近 180 天（几分钟）
      - name: collect TENAA 进网许可 (MIIT)
        run: |
          SINCE=""
          if [ -f brands/tenaa.json ] && [ "$(wc -c < brands/tenaa.json)" -gt 100000 ]; then
            SINCE="--since $(date -d '-180 days' +%F)"
            echo "incremental mode (existing data found): $SINCE"
          else
            echo "full crawl mode (no complete data yet)"
          fi
          ./mobilemodels-db collect --source tenaa --out brands $SINCE

      - name: rebuild redb KV + HNSW index
        run: ./mobilemodels-db build --data-dir data --source brands

      - name: export structured json
        run: ./mobilemodels-db export data/devices.json --data-dir data

      - name: commit data refresh
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(daily): refresh data from Google Play"
          file_pattern: brands/
