[package]
name = "mobilemodels-db"
version = "0.1.0"
edition = "2024"
description = "Data-ify MobileModels: parse brand markdown -> redb KV store + usearch vector index"

[dependencies]
redb = "4.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
anyhow = "1"
hnsw_rs = "0.3"
anndists = "0.1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }

[profile.release]
# NOTE: avoid linker-plugin-lto + codegen-units=1 — it triggers a rustc ICE
# on the `windows` crate with this nightly toolchain.
strip = true
