name: daily-collect

on:
  schedule:
    # 每天 18:00 UTC = 北京时间 02:00（凌晨低峰）
    - cron: "0 18 * * *"
  workflow_dispatch: {} # 支持手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: build binary
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: collect from Google Play (official device list)
        run: ./rust/target/release/mobilemodels-db collect --source google-play --out brands

      # Apple 全系（Wikipedia List of iPhone models：A 编号 + 硬件代号）
      - name: collect Apple (complete, Wikipedia)
        run: ./rust/target/release/mobilemodels-db collect --source apple-all --out brands
      # Wikipedia（CC BY-SA）：CI US 运行器可访问
      - name: collect Huawei / HarmonyOS (Wikipedia)
        run: ./rust/target/release/mobilemodels-db collect --source wikipedia-huawei --out brands
      # 工信部进网许可（国行手机权威数据；全量约 44k 条，需 1-3.5 小时（政府站响应慢+30 条/查询上限））
      - name: collect TENAA 进网许可 (MIIT)
        run: ./rust/target/release/mobilemodels-db collect --source tenaa --out brands

      - name: rebuild redb KV + HNSW index
        run: ./rust/target/release/mobilemodels-db build --data-dir data --source brands

      - name: export structured json
        run: ./rust/target/release/mobilemodels-db export data/devices.json --data-dir data

      - name: commit data refresh
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(daily): refresh data from Google Play"
          file_pattern: brands/
